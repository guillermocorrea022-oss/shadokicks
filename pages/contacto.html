<!DOCTYPE html>
<html lang="es">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Contacto | Shadokicks</title>

		<meta name="description" content="Contactá a Shadokicks para consultas sobre zapatillas de edición limitada, pedidos y soporte." />
		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://www.shadokicks.com/pages/contacto.html" />

		<meta property="og:title" content="Contacto | Shadokicks" />
		<meta property="og:description" content="Contactá a Shadokicks para consultas, pedidos y soporte." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://www.shadokicks.com/pages/contacto.html" />
		<meta property="og:image" content="https://www.shadokicks.com/imagenes/og-cover.jpg" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Contacto | Shadokicks" />
		<meta name="twitter:description" content="Contactá a Shadokicks para consultas, pedidos y soporte." />
		<meta name="twitter:image" content="https://www.shadokicks.com/imagenes/og-cover.jpg" />

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
			  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

		<link rel="stylesheet" href="../css/estilos.css">

		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "ContactPage",
			"name": "Contacto",
			"url": "https://www.shadokicks.com/pages/contacto.html",
			"isPartOf": {
				"@type": "WebSite",
				"name": "Shadokicks",
				"url": "https://www.shadokicks.com/"
			}
		}
		</script>
	</head>

	<body>

		<header>
			<div class="contenedor-header">
				<nav>
					<a class="header-logo" href="../index.html">
						<img class="logo-sitio" src="../imagenes/logo.png" alt="Shadokicks">
					</a>
				</nav>

				<nav class="menu-principal">
					<a href="../pages/tienda.html" class="boton-enlace">Tienda</a>
				</nav>

				<div class="contenedor-busqueda">
					<label for="busqueda" class="visually-hidden">Buscar productos</label>
					<input id="busqueda" class="campo-busqueda" type="text" placeholder="Buscar productos">
					<button class="boton-buscar" type="button">Buscar</button>
				</div>

				<nav class="header-acciones">
					<button class="boton-icono" type="button" aria-label="Carrito" data-bs-toggle="offcanvas" data-bs-target="#carritoOffcanvas">
						<img class="icono" src="../imagenes/carrito.png" alt="Icono de carrito">
						<span class="badge-carrito">0</span>
					</button>

					<a class="boton-icono-iniciar" href="#" aria-label="Iniciar sesión">
						<img class="icono" src="../imagenes/iniciar-sesion-icono.png" alt="Icono de iniciar sesión">
					</a>

					<a href="#" class="boton-enlace boton-login">Iniciar sesión</a>
				</nav>

			</div>
		</header>

		<main class="py-5">

			<section class="titulo-principal" id="contactanos">Contactanos</section>

			<div class="container">
				<div class="row justify-content-center">
					<div class="col-12 col-md-8 col-lg-6">

						<form id="formContacto" novalidate>
							<div class="mb-3">
								<label class="form-label" for="nombre">Nombre</label>
								<input id="nombre" name="nombre" type="text" class="form-control" autocomplete="name">
							</div>

							<div class="mb-3">
								<label class="form-label" for="email">Email</label>
								<input id="email" name="email" type="email" class="form-control" autocomplete="email">
							</div>

							<div class="mb-3">
								<label class="form-label" for="mensaje">Mensaje</label>
								<textarea id="mensaje" name="mensaje" class="form-control" rows="4"></textarea>
							</div>

							<button type="submit" class="btn w-100 btn-enviar">Enviar</button>
						</form>

					</div>
				</div>
			</div>
		</main>

		<footer>
			<div class="contenedor-footer">
				<nav>
					<a href="../pages/contacto.html" class="boton-enlace">Contactanos</a>
				</nav>
				<nav>
					<a href="../index.html">
						<img class="logo-sitio" src="../imagenes/logo.png" alt="Shadokicks">
					</a>
				</nav>
				<nav>
					<a href="../pages/sobrenosotros.html" class="boton-enlace">Nuestra historia</a>
				</nav>
			</div>
		</footer>

		<!-- CARRITO -->
		<div class="offcanvas offcanvas-end carrito-drawer" tabindex="-1" id="carritoOffcanvas" aria-labelledby="carritoTitulo">
			<div class="offcanvas-header">
				<h5 class="offcanvas-title" id="carritoTitulo">Tu carrito</h5>
				<button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
			</div>
			<div class="offcanvas-body">
				<div id="listaCarrito"></div>
			</div>
			<div class="carrito-footer">
				<div class="carrito-total">
					<span>Total:</span>
					<span id="totalCarrito">$0</span>
				</div>
				<button id="btnVaciar" class="btn btn-outline-secondary w-100 mb-2">Vaciar carrito</button>
				<button id="btnFinalizar" class="btn btn-primary w-100" disabled>Finalizar compra</button>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

		<script src="../js/auth.js"></script>
		<script src="../js/app.js"></script>
		<script src="../js/contacto.js"></script>
	</body>

</html>
