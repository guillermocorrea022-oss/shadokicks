		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

		<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

			  rel="stylesheet"
			  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			  crossorigin="anonymous">

		<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "CollectionPage",
			"name": "Tienda de zapatillas de edición limitada",
			"url": "https://www.shadokicks.com/pages/tienda.html",
			"isPartOf": {
				"@type": "WebSite",
				"name": "Shadokicks",
				"url": "https://www.shadokicks.com/"
			}
		}
		</script>
	</head>

	<body>
		<header>
			<div class="contenedor-header">
				<nav>
					<a class="header-logo" href="../index.html">
						<img class="logo-sitio" src="../imagenes/logo.png" alt="Shadokicks">
					</a>
				</nav>

				<nav class="menu-principal">
					<a href="../pages/tienda.html" class="boton-enlace">Tienda</a>
				</nav>

				<div class="contenedor-busqueda">
					<label for="busqueda" class="visually-hidden">Buscar productos</label>
					<input id="busqueda" class="campo-busqueda" type="text" placeholder="Buscar productos">
					<button class="boton-buscar" type="button">Buscar</button>
				</div>

				<nav class="header-acciones">
					<button class="boton-icono" type="button" aria-label="Carrito" data-bs-toggle="offcanvas" data-bs-target="#carritoOffcanvas">
						<img class="icono" src="../imagenes/carrito.png" alt="Icono de carrito">
						<span class="badge-carrito">0</span>
					</button>

					<a class="boton-icono-iniciar" href="#" aria-label="Iniciar sesión">
						<img class="icono" src="../imagenes/iniciar-sesion-icono.png" alt="Icono iniciar sesión">
					</a>

					<a href="#" class="boton-enlace boton-login">Iniciar sesión</a>
				</nav>
			</div>
		</header>

		<main>
			<section class="seccion-tienda">
				<div class="encabezado-tienda">
					<h1 class="titulo-tienda">Tienda</h1>
					<img class="logo-historia" src="../imagenes/logo.png" alt="Shadokicks">
				</div>

				<div class="carousel-tienda-wrapper">
					<div id="carouselTienda" class="carousel slide carousel-tienda" data-bs-ride="carousel" data-bs-interval="4000">
						<div class="carousel-indicators">
							<button type="button" data-bs-target="#carouselTienda" data-bs-slide-to="0" class="active" aria-label="Slide 1"></button>
							<button type="button" data-bs-target="#carouselTienda" data-bs-slide-to="1" aria-label="Slide 2"></button>
							<button type="button" data-bs-target="#carouselTienda" data-bs-slide-to="2" aria-label="Slide 3"></button>
						</div>

						<div class="carousel-inner">
							<div class="carousel-item active">
								<img src="../imagenes/slide-1.jpg" class="d-block w-100" alt="Publicidad 1">
							</div>
							<div class="carousel-item">
								<img src="../imagenes/slide-2.jpg" class="d-block w-100" alt="Publicidad 2">
							</div>
							<div class="carousel-item">
								<img src="../imagenes/slide-3.jpg" class="d-block w-100" alt="Publicidad 3">
							</div>
						</div>

						<button class="carousel-control-prev" type="button" data-bs-target="#carouselTienda" data-bs-slide="prev">
							<span class="carousel-control-prev-icon" aria-hidden="true"></span>
							<span class="visually-hidden">Anterior</span>
						</button>

						<button class="carousel-control-next" type="button" data-bs-target="#carouselTienda" data-bs-slide="next">
							<span class="carousel-control-next-icon" aria-hidden="true"></span>
							<span class="visually-hidden">Siguiente</span>
						</button>
					</div>
				</div>

				<!-- FILTROS -->
				<div class="filtros-tienda">
					<input id="filtroBusqueda" type="text" placeholder="Buscar producto por nombre..." class="form-control">
					<select id="filtroOrden" class="form-select">
						<option value="default">Ordenar por...</option>
						<option value="precio-asc">Precio: menor a mayor</option>
						<option value="precio-desc">Precio: mayor a menor</option>
						<option value="nombre">Nombre A-Z</option>
					</select>
				</div>

				<!-- NUEVOS LANZAMIENTOS -->
				<section class="bloque-tienda">
					<div class="encabezado-tienda-nuevos-l">
						<h2 class="titulo-seccion-tienda" data-aos="fade-up" data-aos-duration="800">Nuevos Lanzamientos</h2>
					</div>
					<div class="contenedor-tarjetas" id="nuevosLanzamientos"></div>
				</section>

				<!-- SHADOW DESTACADOS -->
				<section class="bloque-tienda">
					<h2 class="titulo-seccion-tienda" data-aos="fade-up" data-aos-duration="800">Shadow Destacados</h2>
					<div class="contenedor-tarjetas" id="shadowDestacados"></div>
				</section>

				<!-- TODOS LOS PARES -->
				<section class="bloque-tienda">
					<h2 class="titulo-seccion-tienda" id="tituloTodos" data-aos="fade-up" data-aos-duration="800">Todos los pares</h2>
					<div class="contenedor-tarjetas" id="todosLosPares"></div>
				</section>

			</section>
		</main>

		<footer>
			<div class="contenedor-footer">
				<nav>
					<a href="../pages/contacto.html" class="boton-enlace">Contactanos</a>
				</nav>
				<nav>
					<a href="../index.html">
						<img class="logo-sitio" src="../imagenes/logo.png" alt="Shadokicks">
					</a>
				</nav>
				<nav>
					<a href="../pages/sobrenosotros.html" class="boton-enlace">Nuestra historia</a>
				</nav>
			</div>
		</footer>

		<!-- CARRITO -->
		<div class="offcanvas offcanvas-end carrito-drawer" tabindex="-1" id="carritoOffcanvas" aria-labelledby="carritoTitulo">
			<div class="offcanvas-header">
				<h5 class="offcanvas-title" id="carritoTitulo">Tu carrito</h5>
				<button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
			</div>
			<div class="offcanvas-body">
				<div id="listaCarrito"></div>
			</div>
			<div class="carrito-footer">
				<div class="carrito-total">
					<span>Total:</span>
					<span id="totalCarrito">$0</span>
				</div>
				<button id="btnVaciar" class="btn btn-outline-secondary w-100 mb-2">Vaciar carrito</button>
				<button id="btnFinalizar" class="btn btn-primary w-100" disabled>Finalizar compra</button>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
		<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

		<script src="../js/app.js"></script>
		<script src="../js/tienda.js"></script>
	</body>

</html>
