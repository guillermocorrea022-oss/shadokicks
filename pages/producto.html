<!DOCTYPE html>
<html lang="es">

	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Detalle del producto | Shadokicks</title>

		<meta name="description"
			  content="Detalle del producto en Shadokicks. Elegí tu talle y sumalo al carrito." />

		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://www.shadokicks.com/pages/producto.html" />

		<meta property="og:title" content="Detalle del producto | Shadokicks" />
		<meta property="og:description" content="Zapatillas de edición limitada Shadokicks." />
		<meta property="og:type" content="product" />
		<meta property="og:url" content="https://www.shadokicks.com/pages/producto.html" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Detalle del producto | Shadokicks" />
		<meta name="twitter:description" content="Zapatillas de edición limitada Shadokicks." />

		<link rel="stylesheet" href="../css/estilos.css" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
		/>

		<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
	</head>

	<body>

		<header>
			<div class="contenedor-header">
				<nav>
					<a class="header-logo" href="../index.html">
						<img class="logo-sitio" src="../imagenes/logo.png" alt="Shadokicks" />
					</a>
				</nav>

				<nav class="menu-principal">
					<a href="../pages/tienda.html" class="boton-enlace">Tienda</a>
				</nav>

				<div class="contenedor-busqueda">
					<label for="busqueda" class="visually-hidden">Buscar productos</label>
					<input id="busqueda" class="campo-busqueda" type="text" placeholder="Buscar productos" />
					<button class="boton-buscar" type="button">Buscar</button>
				</div>

				<nav class="header-acciones">
					<button class="boton-icono" type="button" aria-label="Carrito" data-bs-toggle="offcanvas" data-bs-target="#carritoOffcanvas">
						<img class="icono" src="../imagenes/carrito.png" alt="Icono de carrito" />
						<span class="badge-carrito">0</span>
					</button>

					<a class="boton-icono-iniciar" href="#" aria-label="Iniciar sesión">
						<img class="icono" src="../imagenes/iniciar-sesion-icono.png" alt="Icono iniciar sesión" />
					</a>

					<a href="#" class="boton-enlace boton-login">Iniciar sesión</a>
				</nav>
			</div>
		</header>

		<main class="pagina-producto">

			<section class="container py-5">
				<div class="row g-5 align-items-start">

					<div class="col-12 col-lg-7">
						<div class="producto-imagen text-center">
							<img id="productoImagen" src="" alt="" />
						</div>
					</div>

					<div class="col-12 col-lg-5">
						<div class="producto-info producto-info-bs">

							<h1 id="productoNombre" class="titulo-producto mb-2"></h1>
							<p id="productoPrecio" class="precio-producto mb-3"></p>

							<h2 class="h5 mb-2">Elegí tu talle</h2>
							<div id="talles" class="btn-group w-100 mb-3" role="group" aria-label="Selector de talles"></div>

							<p id="productoDescripcion" class="mb-4"></p>

							<a href="#" id="btnAddDetalle" class="btn btn-primary w-100 btn-anadir" data-detalle="true">
								Añadir al carrito
							</a>

						</div>
					</div>

				</div>
			</section>

			<!-- PRODUCTOS RELACIONADOS -->
			<section class="bloque-tienda py-4">
				<div class="container">
					<h2 class="titulo-seccion-producto mb-4">Productos Relacionados</h2>
					<div class="contenedor-tarjetas" id="productosRelacionados"></div>
				</div>
			</section>

		</main>

		<footer>
			<div class="contenedor-footer">
				<nav>
					<a href="../pages/contacto.html" class="boton-enlace">Contactanos</a>
				</nav>
				<nav>
					<a href="../index.html">
						<img class="logo-sitio" src="../imagenes/logo.png" alt="Shadokicks">
					</a>
				</nav>
				<nav>
					<a href="../pages/sobrenosotros.html" class="boton-enlace">Nuestra historia</a>
				</nav>
			</div>
		</footer>

		<!-- CARRITO -->
		<div class="offcanvas offcanvas-end carrito-drawer" tabindex="-1" id="carritoOffcanvas" aria-labelledby="carritoTitulo">
			<div class="offcanvas-header">
				<h5 class="offcanvas-title" id="carritoTitulo">Tu carrito</h5>
				<button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
			</div>
			<div class="offcanvas-body">
				<div id="listaCarrito"></div>
			</div>
			<div class="carrito-footer">
				<div class="carrito-total">
					<span>Total:</span>
					<span id="totalCarrito">$0</span>
				</div>
				<button id="btnVaciar" class="btn btn-outline-secondary w-100 mb-2">Vaciar carrito</button>
				<button id="btnFinalizar" class="btn btn-primary w-100" disabled>Finalizar compra</button>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
		<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

		<script src="../js/app.js"></script>
		<script src="../js/producto.js"></script>

	</body>
</html>
