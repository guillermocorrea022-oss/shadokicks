<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadokicks - Inicio</title>

    <link rel="stylesheet" href="./css/estilos.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
</head>

    <body>

        <header>
            <div class="contenedor-header">

                <nav>
                    <a class="header-logo" href="./index.html">
                        <img class="logo-sitio" src="./imagenes/logo.png" alt="Shadokicks">
                    </a>
                </nav>

                <nav class="menu-principal">
                    <a href="./pages/tienda.html" class="boton-enlace">Tienda</a>
                </nav>

                <div class="contenedor-busqueda">
                    <input class="campo-busqueda" type="text" placeholder="Buscar productos">
                    <button class="boton-buscar" type="button">Buscar</button>
                </div>

                <nav class="header-acciones">
                    <button class="boton-icono" type="button" aria-label="Carrito">
                        <img class="icono" src="./imagenes/carrito.png" alt="Icono de carrito">
                    </button>

                    <a class="boton-icono-iniciar" href="#" aria-label="Iniciar sesión">
                        <img class="icono" src="./imagenes/iniciar-sesion-icono.png" alt="Icono de iniciar sesión">
                    </a>

                    <a href="#" class="boton-enlace boton-login">Iniciar sesión</a>
                </nav>

            </div>
        </header>

        <main>

            <div id="carouselExampleIndicators"
                class="carousel slide"
                data-bs-ride="carousel"
                data-bs-interval="4000">

                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
                </div>

                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="./imagenes/slide-1.jpg" class="d-block w-100"
                            alt="Banner promocional Shadokicks - Slide 1">
                    </div>

                    <div class="carousel-item">
                        <img src="./imagenes/slide-2.jpg" class="d-block w-100"
                            alt="Banner promocional Shadokicks - Slide 2">
                    </div>

                    <div class="carousel-item">
                        <img src="./imagenes/slide-3.jpg" class="d-block w-100"
                            alt="Banner promocional Shadokicks - Slide 3">
                    </div>
                </div>

                <button class="carousel-control-prev"
                        type="button"
                        data-bs-target="#carouselExampleIndicators"
                        data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>

                <button class="carousel-control-next"
                        type="button"
                        data-bs-target="#carouselExampleIndicators"
                        data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>

            </div>

            <section aria-label="Shadow Destacados">

                <h2 class="titulo-principal" data-aos="fade-up">
                    Shadow Destacados
                </h2>

                <div class="contenedor-tarjetas">

                    <article class="tarjeta-producto fondo-1"
                            data-aos="fade-up"
                            data-aos-duration="800">

                        <a href="./pages/producto.html" class="link-tarjeta">

                            <div class="tarjeta-encabezado">
                                <div class="precio-tarjeta">$490</div>

                                <div class="logo-tarjeta">
                                    <img src="./imagenes/logo.png" alt="Shadokicks">
                                </div>
                            </div>

                            <div class="tarjeta-cuerpo">
                                <img class="producto"
                                    src="./imagenes/zapatilla1.png"
                                    alt="Zapatilla 1">
                            </div>

                        </a>

                        <div class="tarjeta-pie">
                            <div class="pie-interno">
                                <button type="button" class="btn-anadir">
                                    Añadir al carrito
                                </button>
                            </div>
                        </div>

                    </article>

                    <article class="tarjeta-producto fondo-2"
                            data-aos="fade-up"
                            data-aos-duration="800"
                            data-aos-delay="100">

                        <a href="./pages/producto.html" class="link-tarjeta">

                            <div class="tarjeta-encabezado">
                                <div class="precio-tarjeta">$520</div>

                                <div class="logo-tarjeta">
                                    <img src="./imagenes/logo.png" alt="Shadokicks">
                                </div>
                            </div>

                            <div class="tarjeta-cuerpo">
                                <img class="producto"
                                    src="./imagenes/zapatilla2.png"
                                    alt="Zapatilla 2">
                            </div>

                        </a>

                        <div class="tarjeta-pie">
                            <div class="pie-interno">
                                <button type="button" class="btn-anadir">
                                    Añadir al carrito
                                </button>
                            </div>
                        </div>

                    </article>

                    <article class="tarjeta-producto fondo-3"
                            data-aos="fade-up"
                            data-aos-duration="800"
                            data-aos-delay="200">

                        <a href="./pages/producto.html" class="link-tarjeta">

                            <div class="tarjeta-encabezado">
                                <div class="precio-tarjeta">$560</div>

                                <div class="logo-tarjeta">
                                    <img src="./imagenes/logo.png" alt="Shadokicks">
                                </div>
                            </div>

                            <div class="tarjeta-cuerpo">
                                <img class="producto"
                                    src="./imagenes/zapatilla3.png"
                                    alt="Zapatilla 3">
                            </div>

                        </a>

                        <div class="tarjeta-pie">
                            <div class="pie-interno">
                                <button type="button" class="btn-anadir">
                                    Añadir al carrito
                                </button>
                            </div>
                        </div>

                    </article>

                    <article class="tarjeta-producto fondo-4"
                            data-aos="fade-up"
                            data-aos-duration="800"
                            data-aos-delay="300">

                        <a href="./pages/producto.html" class="link-tarjeta">

                            <div class="tarjeta-encabezado">
                                <div class="precio-tarjeta">$610</div>

                                <div class="logo-tarjeta">
                                    <img src="./imagenes/logo.png" alt="Shadokicks">
                                </div>
                            </div>

                            <div class="tarjeta-cuerpo">
                                <img class="producto"
                                    src="./imagenes/zapatilla4.png"
                                    alt="Zapatilla 4">
                            </div>

                        </a>

                        <div class="tarjeta-pie">
                            <div class="pie-interno">
                                <button type="button" class="btn-anadir">
                                    Añadir al carrito
                                </button>
                            </div>
                        </div>

                    </article>

                </div>

            </section>

        </main>

        <footer>
            <div class="contenedor-footer">

                <nav>
                    <a href="./pages/contacto.html" class="boton-enlace">
                        Contactanos
                    </a>
                </nav>

                <nav>
                    <a href="index.html">
                        <img class="logo-sitio" src="./imagenes/logo.png" alt="Shadokicks">
                    </a>
                </nav>

                <nav>
                    <a href="./pages/sobrenosotros.html" class="boton-enlace">
                        Nuestra historia
                    </a>
                </nav>

            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

        <script>
            AOS.init({
                once: true,
                easing: "ease-out-cubic"
            });
        </script>

    </body>
</html>
